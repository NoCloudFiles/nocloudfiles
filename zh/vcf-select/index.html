<!doctype html>
<html lang="zh-CN" data-tool="vcf_select">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>从通讯录备份挑选联系人 — NoCloudFiles</title>
    <meta
      name="description"
      content="在浏览器本地打开 VCF 备份，只选需要的人和字段，无需导入系统通讯录。"
    />
    <link rel="canonical" href="https://nocloudfiles.com/zh/vcf-select/" />
    <link
      rel="alternate"
      hreflang="en"
      href="https://nocloudfiles.com/vcf-select/"
    />
    <link
      rel="alternate"
      hreflang="zh-Hans"
      href="https://nocloudfiles.com/zh/vcf-select/"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://nocloudfiles.com/vcf-select/"
    />
  </head>
  <body>
    <header>
      <a class="brand" href="/zh/">NoCloudFiles</a>
      <span class="header-note">免费 · 无需注册</span>
      <a class="language-switch" href="/vcf-select/" lang="en" hreflang="en"
        ><svg
          aria-hidden="true"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M3 12h18M12 3a18 18 0 0 1 0 18 18 18 0 0 1 0-18Z" /></svg
        ><span>English</span></a
      >
    </header>
    <main class="import-tool">
      <section class="hero tool-intro">
        <h1>从通讯录备份挑选联系人</h1>
        <p>
          在浏览器本地打开 VCF 备份，只选需要的人和字段，无需导入系统通讯录。
        </p>
      </section>
      <section class="tool-card">
        <label for="file">打开 VCF 备份（最大 30 MiB）</label
        ><input type="file" id="file" accept=".vcf,.vcard,text/vcard" /><button
          id="sample"
        >
          试用示例
        </button>
        <p id="status" role="status"></p>
        <section id="choose" hidden>
          <label>搜索姓名、电话或邮箱<input id="search" type="search" /></label>
          <p id="count"></p>
          <div id="people"></div>
          <button id="more">显示更多</button>
          <h2>选择要分享的字段</h2>
          <p>
            导出会包含所选姓名。其他值逐项勾选；头像和私有扩展字段会被移除。
          </p>
          <div id="fields"></div>
          <button id="build">生成 VCF</button>
        </section>
        <section id="result" hidden>
          <details>
            <summary>查看导出 VCF 全文</summary>
            <pre id="raw"></pre>
          </details>
          <div id="links"></div>
        </section>
      </section>
    </main>
    <footer>
      <span>NoCloudFiles · 内容留在你的设备上</span>
      <div class="footer-links">
        <a href="/about.html">隐私与说明</a
        ><a href="https://github.com/NoCloudFiles/nocloudfiles">源代码</a>
      </div>
    </footer>
    <script type="module" src="/src/contacts-ui.js"></script>
  </body>
</html>
