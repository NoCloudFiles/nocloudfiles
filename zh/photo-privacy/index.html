<!doctype html>
<html lang="zh-CN" data-tool="photo_privacy">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>照片隐私检查 — NoCloudFiles</title>
    <meta
      name="description"
      content="查看手机原图中记录的位置、拍摄时间和署名，选择要保留的信息，生成可分享的静态 JPEG。"
    />
    <link rel="canonical" href="https://nocloudfiles.com/zh/photo-privacy/" />
    <link
      rel="alternate"
      hreflang="en"
      href="https://nocloudfiles.com/photo-privacy/"
    />
    <link
      rel="alternate"
      hreflang="zh-Hans"
      href="https://nocloudfiles.com/zh/photo-privacy/"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://nocloudfiles.com/photo-privacy/"
    />
  </head>
  <body>
    <header>
      <a class="brand" href="/zh/">NoCloudFiles</a>
      <span class="header-note">免费 · 无需注册</span>
      <a class="language-switch" href="/photo-privacy/" lang="en" hreflang="en"
        ><svg
          aria-hidden="true"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M3 12h18M12 3a18 18 0 0 1 0 18 18 18 0 0 1 0-18Z" /></svg
        ><span>English</span></a
      >
    </header>
    <main>
      <section class="hero tool-intro">
        <h1>照片隐私检查</h1>
        <p>
          查看手机原图中记录的位置、拍摄时间和署名，选择要保留的信息，生成可分享的静态
          JPEG。
        </p>
      </section>
      <section class="tool-card">
        <label for="photo">选择 JPEG 或 HEIC 原图</label
        ><input
          id="photo"
          type="file"
          accept=".jpg,.jpeg,.heic,.heif,image/jpeg,image/heic,image/heif"
        />
        <p id="status" role="status"></p>
        <div id="inspection"></div>
      </section>
    </main>
    <footer>
      <span>NoCloudFiles · 内容留在你的设备上</span>
      <div class="footer-links">
        <a href="/about.html">隐私与说明</a
        ><a href="https://github.com/NoCloudFiles/nocloudfiles">源代码</a>
      </div>
    </footer>
    <script type="module" src="/src/privacy-ui.js"></script>
  </body>
</html>
