<!doctype html>
<html lang="en" data-tool="photo_privacy">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Photo privacy check — NoCloudFiles</title>
    <meta
      name="description"
      content="See what your phone photo reveals. Choose the details to keep and save a shareable still JPEG."
    />
    <link rel="canonical" href="https://nocloudfiles.com/photo-privacy/" />
    <link
      rel="alternate"
      hreflang="en"
      href="https://nocloudfiles.com/photo-privacy/"
    />
    <link
      rel="alternate"
      hreflang="zh-Hans"
      href="https://nocloudfiles.com/zh/photo-privacy/"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://nocloudfiles.com/photo-privacy/"
    />
  </head>
  <body>
    <header>
      <a class="brand" href="/">NoCloudFiles</a>
      <span class="header-note">Free · No sign-up</span>
      <a
        class="language-switch"
        href="/zh/photo-privacy/"
        lang="zh-CN"
        hreflang="zh-CN"
        ><svg
          aria-hidden="true"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M3 12h18M12 3a18 18 0 0 1 0 18 18 18 0 0 1 0-18Z" /></svg
        ><span>中文</span></a
      >
    </header>
    <main>
      <section class="hero tool-intro">
        <h1>Photo privacy check</h1>
        <p>
          See what your phone photo reveals. Choose the details to keep and save
          a shareable still JPEG.
        </p>
      </section>
      <section class="tool-card">
        <label for="photo">Choose an original JPEG or HEIC photo</label
        ><input
          id="photo"
          type="file"
          accept=".jpg,.jpeg,.heic,.heif,image/jpeg,image/heic,image/heif"
        />
        <p id="status" role="status"></p>
        <div id="inspection"></div>
      </section>
    </main>
    <footer>
      <span>NoCloudFiles · Your content stays on your device</span>
      <div class="footer-links">
        <a href="/about-en.html">Privacy and about</a
        ><a href="https://github.com/NoCloudFiles/nocloudfiles">Source code</a>
      </div>
    </footer>
    <script type="module" src="/src/privacy-ui.js"></script>
  </body>
</html>
